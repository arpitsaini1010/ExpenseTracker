{% extends 'base.html' %}

{% block title %}Page Not Found (404) - SmartExpense{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="p-5 bg-white rounded-4 shadow-sm border">
            <div class="text-primary display-1 fw-bold mb-3">404</div>
            <h3 class="fw-bold text-dark mb-2">Page or Record Not Found</h3>
            <p class="text-muted mb-4">
                The requested expense, budget, or URL was not found or you don't have permission to access it.
            </p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary rounded-pill px-4 py-2 shadow-sm">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
