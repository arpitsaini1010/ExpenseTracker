{% extends 'base.html' %}

{% block title %}Method Not Allowed (405) - SmartExpense{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="p-5 bg-white rounded-4 shadow-sm border">
            <div class="text-secondary display-1 fw-bold mb-3"><i class="bi bi-slash-circle"></i></div>
            <h3 class="fw-bold text-dark mb-2">Method Not Allowed (405)</h3>
            <p class="text-muted mb-4">
                The action you attempted cannot be requested using this HTTP method. Please use the application navigation.
            </p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary rounded-pill px-4 py-2 shadow-sm">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
